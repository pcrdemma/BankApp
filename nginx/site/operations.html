<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBank — Opérations</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="operations">
  <div id="header"></div>

  <main>
    <div class="page-banner">
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Accueil</a> / Opérations</div>
        <h2>Dépôts et retraits</h2>
        <p class="muted">Sélectionnez un compte puis effectuez votre opération.</p>
      </div>
    </div>

    <section class="section" style="padding-top:40px">
      <div class="container op-layout">
        <div class="card">
          <div class="tabs">
            <button class="tab active" id="tabDepot" onclick="setType('depot')">💰 Dépôt</button>
            <button class="tab" id="tabRetrait" onclick="setType('retrait')">💸 Retrait</button>
          </div>
          <div class="field"><label>Compte</label><select class="input" id="compteSel"></select></div>
          <div class="field"><label>Montant</label><div class="input-money"><input class="input" id="montant" type="number" min="0.01" step="0.01" placeholder="0.00"></div></div>
          <div class="quick">
            <button class="chip-btn" onclick="setMontant(20)">20 $</button>
            <button class="chip-btn" onclick="setMontant(50)">50 $</button>
            <button class="chip-btn" onclick="setMontant(100)">100 $</button>
            <button class="chip-btn" onclick="setMontant(500)">500 $</button>
          </div>
          <button class="btn btn-success btn-block" id="btnValider" onclick="valider()">Valider le dépôt</button>
        </div>

        <div>
          <div class="balance-box">
            <div class="label" id="soldeNom">Sélectionnez un compte</div>
            <div class="big" id="soldeVal">— $</div>
            <a class="btn btn-ghost btn-sm" id="lienHisto" href="historique.html">Voir l'historique →</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/app.js"></script>
  <script src="js/operations.js"></script>
</body>
</html>
