# Bloc serveur : définit comment nginx répond aux requêtes HTTP
server {
    # nginx écoute sur le port 80 (HTTP standard)
    listen 80;
    # Nom de domaine auquel répond ce serveur (ici uniquement en local)
    server_name localhost;

    # Dossier racine où se trouvent les fichiers du site (copiés par le Dockerfile)
    root /usr/share/nginx/html;
    # Fichier servi par défaut quand on demande un dossier (ex: http://localhost/ renvoie index.html)
    index index.html;

    # Règle générale : toutes les requêtes qui ne sont pas traitées par une autre règle
    location / {
        # nginx essaie dans l'ordre : le fichier demandé ($uri), puis le dossier ($uri/),
        # sinon il renvoie une erreur 404 (page introuvable)
        try_files $uri $uri/ =404;
    }

    # Règle pour l'API : toutes les requêtes dont l'adresse commence par /api/
    location /api/ {
        # Je transmets la requête au conteneur "api" (l'application Flask) sur le port 5000.
        # nginx sert de passerelle (reverse proxy) : le navigateur ne parle jamais directement à Flask
        proxy_pass http://api:5000;
        # Je transmets le nom de domaine d'origine à Flask
        proxy_set_header Host $host;
        # Je transmets l'adresse IP réelle du visiteur à Flask (sinon Flask verrait nginx comme client)
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache léger pour les ressources statiques : fichiers CSS, JavaScript, images
    location ~* \.(css|js|svg|png|jpg|ico)$ {
        # Le navigateur garde ces fichiers en mémoire pendant 1 heure
        # avant de les redemander, ce qui accélère le chargement des pages
        expires 1h;
        # Indique au navigateur et aux intermédiaires que ces fichiers peuvent être mis en cache publiquement
        add_header Cache-Control "public";
    }
}